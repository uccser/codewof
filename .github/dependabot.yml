# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/infrastructure/**/*"
    schedule:
      interval: "daily"
    ignore:
    # Not actually semver minor, but this is how to block an update from Python 3.9 to 3.14, for example...
    # PLEASE STILL DO THESE UPDATES MANUALLY AT LEAST BEFORE EOL. This just stops dependabot automating it...
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
      
    open-pull-requests-limit: 999
  - package-ecosystem: "npm"
    directory: "/codewof/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 999
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 999
    ignore:
    # Ignore updates to Django package until LTS version
      - dependency-name: "django"
        versions: ["4.0.*", "4.1.*", "5.0.*", "5.1.*", "6.0.*", "6.1.*", "7.0.*", "7.1.*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 999
